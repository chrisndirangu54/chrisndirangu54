<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechRuptors: Circuit Quest</title><style>:root{color-scheme:dark;font-family:system-ui,sans-serif}body{background:#080f22;color:#e2e8f0;margin:0;display:grid;min-height:100vh;place-items:center}main{width:min(94vw,630px);text-align:center}h1{color:#67e8f9}canvas{border:2px solid #38bdf8;border-radius:12px;max-width:100%;touch-action:none;background:#111b34}button,a{display:inline-block;padding:12px 18px;border:1px solid #67e8f9;border-radius:9px;background:#1e293b;color:white;text-decoration:none;cursor:pointer;margin:8px}.hint{color:#a5b4fc}footer{font-size:13px;color:#94a3b8;margin:20px}</style></head><body><main><h1>⚡ TechRuptors: Circuit Quest</h1><p>Collect glowing data nodes. Avoid red glitches. Move with ← → or A / D. On mobile, drag across the board.</p><canvas id="board" width="540" height="400" aria-label="Circuit Quest game area"></canvas><p id="status" aria-live="polite">Score: 0 · Lives: 3</p><button id="start">Start / Restart</button><a href="https://techruptors-africa.web.app/">Explore TechRuptors</a><p class="hint">Made with original canvas graphics, zero libraries, and no tracking.</p><footer>MIT licensed · Built for the GitHub community</footer></main><script>const c=document.getElementById('board'),x=c.getContext('2d'),status=document.getElementById('status');let ship=270,score=0,lives=3,items=[],playing=false,last=0,spawn=0,id=0,keys=new Set();function reset(){ship=270;score=0;lives=3;items=[];last=0;spawn=0;playing=true;cancelAnimationFrame(id);id=requestAnimationFrame(tick)}document.getElementById('start').onclick=reset;onkeydown=e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key)){e.preventDefault();keys.add(e.key.toLowerCase())}};onkeyup=e=>keys.delete(e.key.toLowerCase());c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){let r=c.getBoundingClientRect();ship=Math.max(20,Math.min(520,(e.clientX-r.left)*c.width/r.width))}});c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();ship=Math.max(20,Math.min(520,(e.clientX-r.left)*c.width/r.width))});function tick(t){if(!playing)return;let dt=Math.min((t-last||16)/1000,.05);last=t;spawn+=dt;if(keys.has('arrowleft')||keys.has('a'))ship-=290*dt;if(keys.has('arrowright')||keys.has('d'))ship+=290*dt;ship=Math.max(20,Math.min(520,ship));if(spawn>.65){items.push({x:20+Math.random()*500,y:-12,bad:Math.random()<.31});spawn=0}x.clearRect(0,0,540,400);x.strokeStyle='#263a60';for(let i=0;i<540;i+=30){x.beginPath();x.moveTo(i,0);x.lineTo(i,400);x.stroke()}for(let i=0;i<400;i+=30){x.beginPath();x.moveTo(0,i);x.lineTo(540,i);x.stroke()}x.fillStyle='#67e8f9';x.beginPath();x.moveTo(ship,347);x.lineTo(ship-18,381);x.lineTo(ship+18,381);x.closePath();x.fill();items=items.filter(p=>{p.y+=(120+score*.7)*dt;x.fillStyle=p.bad?'#fb7185':'#34d399';x.beginPath();x.arc(p.x,p.y,11,0,Math.PI*2);x.fill();if(Math.abs(p.x-ship)<25&&Math.abs(p.y-364)<22){if(p.bad)lives--;else score+=10;return false}return p.y<420});status.textContent='Score: '+score+' · Lives: '+lives;if(lives<=0){playing=false;x.fillStyle='white';x.font='bold 32px system-ui';x.textAlign='center';x.fillText('Game over · '+score+' points',270,200);return}id=requestAnimationFrame(tick)}x.fillStyle='#67e8f9';x.font='22px system-ui';x.textAlign='center';x.fillText('Press Start to play!',270,200);</script></body></html>
